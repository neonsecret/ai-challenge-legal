repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      # Linter
      - id: ruff
        args: [--fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, --skip, "B101,B105,B106,B110,B311,B310,B404,B603,B605,B607,B608,B615"]
        # Run only on application source, not tests or scripts
        files: ^(arlc|neolex)/
