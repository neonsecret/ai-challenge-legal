# Postiz — self-hosted social media scheduler for Vitreon
#
# Port remapping to avoid conflicts with existing services:
#   postiz-web: 4007 (default)
#   postgres: 5434 (avoid 5432/5433)
#   redis: 6381 (avoid 6379/6380)
#   temporal: 7233 (default)
#   temporal-ui: 8081 (avoid 8080 potential conflicts)
#
# Start: docker compose -f docker-compose.postiz.yml up -d
# Stop:  docker compose -f docker-compose.postiz.yml down
# Logs:  docker compose -f docker-compose.postiz.yml logs -f postiz
# UI:    http://localhost:4007

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    environment:
      # === Core URLs (use actual host IP for external access)
      MAIN_URL: ${POSTIZ_URL:-http://100.89.59.71:4007}
      FRONTEND_URL: ${POSTIZ_URL:-http://100.89.59.71:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL:-http://100.89.59.71:4007}/api
      BACKEND_INTERNAL_URL: 'http://localhost:3000'

      # === Security
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?Set POSTIZ_JWT_SECRET in .env (openssl rand -hex 32)}

      # === Database & Cache
      DATABASE_URL: 'postgresql://postiz:postiz@postiz-postgres:5432/postiz'
      REDIS_URL: 'redis://postiz-redis:6379'

      # === Temporal
      TEMPORAL_ADDRESS: "postiz-temporal:7233"

      # === App Settings
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      RUN_CRON: 'true'

      # === Storage (local)
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === Social Media API Keys (configure these)
      X_API_KEY: ${POSTIZ_X_API_KEY:-}
      X_API_SECRET: ${POSTIZ_X_API_SECRET:-}
      LINKEDIN_CLIENT_ID: ${POSTIZ_LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${POSTIZ_LINKEDIN_CLIENT_SECRET:-}

      # === Optional integrations (disabled for now)
      OPENAI_API_KEY: ''

      # === Misc
      NX_ADD_PLUGINS: false
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "0.0.0.0:4007:5000"
    networks:
      - postiz-network
      - postiz-temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz
      POSTGRES_USER: postiz
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz -d postiz
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - postiz-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  postiz-temporal-elasticsearch:
    container_name: postiz-temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - postiz-temporal-network
    expose:
      - 9200
    volumes:
      - postiz-temporal-elasticsearch-data:/var/lib/elasticsearch/data

  postiz-temporal-postgresql:
    container_name: postiz-temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - postiz-temporal-network
    expose:
      - 5432
    volumes:
      - postiz-temporal-postgres-data:/var/lib/postgresql/data

  postiz-temporal:
    container_name: postiz-temporal
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - postiz-temporal-postgresql
      - postiz-temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postiz-temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=postiz-temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    ports:
      - "127.0.0.1:7233:7233"
    networks:
      - postiz-temporal-network
    volumes:
      - ./postiz-dynamicconfig:/etc/temporal/config/dynamicconfig

  postiz-temporal-ui:
    container_name: postiz-temporal-ui
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=postiz-temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - postiz-temporal-network
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postiz-postgres-data:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  postiz-temporal-elasticsearch-data:
  postiz-temporal-postgres-data:

networks:
  postiz-network:
  postiz-temporal-network:
    driver: bridge
