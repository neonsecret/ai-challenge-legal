    <text x="823" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Finals
    </text>

    <!-- Bottom CTA -->
    <rect x="290" y="293" width="320" height="20" rx="10" fill="#238636" opacity="0.8"/>
    <text x="450" y="307" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600"
          fill="#ffffff">Explore the interactive experiment tree →
    </text>
</svg>
