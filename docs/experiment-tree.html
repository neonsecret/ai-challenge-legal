<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARLC 2026 — Experiment Journey Tree</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-hover: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --green: #3fb950;
    --green-bg: rgba(63,185,80,0.15);
    --red: #f85149;
    --red-bg: rgba(248,81,73,0.15);
    --yellow: #d29922;
    --yellow-bg: rgba(210,153,34,0.15);
    --blue: #58a6ff;
    --blue-bg: rgba(88,166,255,0.15);
    --purple: #bc8cff;
    --link: #30363d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 70%, transparent 100%);
    padding: 16px 24px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  #header h1 {
    font-size: 18px;
    font-weight: 600;
    white-space: nowrap;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #header .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
  }

  #search-box {
    flex: 1;
    min-width: 200px;
    max-width: 360px;
    position: relative;
  }

  #search-box input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px 8px 34px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  #search-box input:focus {
    border-color: var(--blue);
  }

  #search-box .icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
  }

  #legend {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  #controls {
    display: flex;
    gap: 8px;
  }

  #controls button {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    padding: 6px 12px;
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  #controls button:hover {
    border-color: var(--blue);
    color: var(--text);
  }

  #tree-container {
    width: 100vw;
    height: 100vh;
    padding-top: 72px;
  }

  svg { width: 100%; height: 100%; }

  .node-group { cursor: pointer; }

  .node-circle {
    stroke-width: 2.5;
    transition: all 0.2s;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.4));
  }

  .node-group:hover .node-circle {
    filter: drop-shadow(0 0 8px rgba(88,166,255,0.5));
    stroke-width: 3;
  }

  .node-group.search-match .node-circle {
    filter: drop-shadow(0 0 12px rgba(188,140,255,0.7));
    stroke-width: 4;
  }

  .node-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    fill: var(--text);
    font-weight: 500;
  }

  .node-desc {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    fill: var(--text-muted);
    font-weight: 400;
  }

  .node-impact {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
  }

  .link {
    fill: none;
    stroke: var(--link);
    stroke-width: 1.5;
    stroke-opacity: 0.5;
    transition: stroke-opacity 0.3s;
  }

  .node-group.dimmed .node-circle { opacity: 0.2; }
  .node-group.dimmed .node-label { opacity: 0.2; }
  .node-group.dimmed .node-desc { opacity: 0.15; }
  .node-group.dimmed .node-impact { opacity: 0.15; }
  .link.dimmed { stroke-opacity: 0.08; }

  .toggle-icon {
    font-size: 10px;
    fill: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
  }

  #tooltip {
    position: fixed;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    max-width: 360px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 200;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    line-height: 1.5;
  }

  #tooltip .tt-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 6px;
  }

  #tooltip .tt-desc { color: var(--text-muted); margin-bottom: 6px; }

  #tooltip .tt-impact {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 4px;
  }

  #tooltip .tt-meta {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 6px;
    border-top: 1px solid var(--border);
    padding-top: 6px;
  }
</style>
</head>
<body>
<div id="header">
  <div>
    <h1>ARLC 2026 Experiment Journey</h1>
    <div class="subtitle">15 warmup submissions &middot; 2 finals submissions &middot; 100+ commits &middot; post-competition analysis &amp; upgrade roadmap</div>
  </div>
  <div id="search-box">
    <span class="icon">&#x1F50D;</span>
    <input type="text" id="search" placeholder="Search experiments... (e.g. opus, grounding, S_det)" />
  </div>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Improved</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Failed</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>Mixed</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Info</div>
  </div>
  <div id="controls">
    <button onclick="expandAll()">Expand All</button>
    <button onclick="collapseAll()">Collapse All</button>
    <button onclick="resetView()">Reset View</button>
  </div>
</div>
<div id="tree-container"></div>
<div id="tooltip"></div>

// ─── D3 Tree Visualization ────────────────────────────────────────────────

const statusColor = {
  success: "#3fb950",
  fail:    "#f85149",
  mixed:   "#d29922",
  info:    "#58a6ff"
};
const statusBg = {
  success: "rgba(63,185,80,0.15)",
  fail:    "rgba(248,81,73,0.15)",
  mixed:   "rgba(210,153,34,0.15)",
  info:    "rgba(88,166,255,0.15)"
};

const margin = { top: 30, right: 200, bottom: 30, left: 80 };
const container = document.getElementById("tree-container");
const width = container.clientWidth;
const height = container.clientHeight;

const svg = d3.select("#tree-container")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

const g = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.15, 3])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);
svg.call(zoom.transform, d3.zoomIdentity.translate(margin.left, height / 2).scale(0.7));

const root = d3.hierarchy(treeData);
root.x0 = height / 2;
root.y0 = 0;

// Collapse children initially (except root + first level)
root.children.forEach(c => {
  if (c.children) {
    c._children = c.children;
    c.children = null;
  }
});

const treemap = d3.tree().nodeSize([38, 280]);

let i = 0;
const duration = 400;

function diagonal(s, d) {
  return `M ${s.y} ${s.x}
          C ${(s.y + d.y) / 2} ${s.x},
            ${(s.y + d.y) / 2} ${d.x},
            ${d.y} ${d.x}`;
}

function update(source) {
  const treeDataLayout = treemap(root);
  const nodes = treeDataLayout.descendants();
  const links = treeDataLayout.links();

  nodes.forEach(d => { d.y = d.depth * 300; });

  // ── Nodes ──
  const node = g.selectAll("g.node-group")
    .data(nodes, d => d.id || (d.id = ++i));

  const nodeEnter = node.enter().append("g")
    .attr("class", "node-group")
    .attr("transform", d => `translate(${source.y0},${source.x0})`)
    .on("click", (event, d) => {
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else if (d._children) {
        d.children = d._children;
        d._children = null;
      }
      update(d);
    })
    .on("mouseenter", showTooltip)
    .on("mousemove", moveTooltip)
    .on("mouseleave", hideTooltip);

  nodeEnter.append("circle")
    .attr("class", "node-circle")
    .attr("r", 0)
    .attr("fill", d => statusBg[d.data.status] || statusBg.info)
    .attr("stroke", d => statusColor[d.data.status] || statusColor.info);

  nodeEnter.append("text")
    .attr("class", "node-label")
    .attr("dy", -14)
    .attr("x", 16)
    .attr("text-anchor", "start")
    .text(d => d.data.name);

  nodeEnter.append("text")
    .attr("class", "node-impact")
    .attr("dy", 2)
    .attr("x", 16)
    .attr("text-anchor", "start")
    .attr("fill", d => statusColor[d.data.status] || statusColor.info)
    .text(d => d.data.impact ? truncate(d.data.impact, 50) : "");

  // Toggle indicator
  nodeEnter.append("text")
    .attr("class", "toggle-icon")
    .attr("dy", 4)
    .attr("text-anchor", "middle")
    .text(d => d._children ? "+" : d.children ? "−" : "");

  // ── Update ──
  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(duration)
    .attr("transform", d => `translate(${d.y},${d.x})`);

  nodeUpdate.select("circle.node-circle")
    .transition().duration(duration)
    .attr("r", d => d._children || d.children ? 8 : 6);

  nodeUpdate.select(".toggle-icon")
    .text(d => d._children ? "+" : d.children ? "−" : "");

  // ── Exit ──
  const nodeExit = node.exit().transition().duration(duration)
    .attr("transform", d => `translate(${source.y},${source.x})`)
    .remove();

  nodeExit.select("circle").attr("r", 0);
  nodeExit.select("text").style("fill-opacity", 0);

  // ── Links ──
  const link = g.selectAll("path.link")
    .data(links, d => d.target.id);

  const linkEnter = link.enter().insert("path", "g")
    .attr("class", "link")
    .attr("d", d => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal(o, o);
    });

  linkEnter.merge(link).transition().duration(duration)
    .attr("d", d => diagonal(d.source, d.target));

  link.exit().transition().duration(duration)
    .attr("d", d => {
      const o = { x: source.x, y: source.y };
      return diagonal(o, o);
    })
    .remove();

  // Stash old positions
  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

update(root);

// ─── Tooltip ──────────────────────────────────────────────────────────────

const tooltip = document.getElementById("tooltip");

function showTooltip(event, d) {
  let html = `<div class="tt-title" style="color:${statusColor[d.data.status]}">${d.data.name}</div>`;
  if (d.data.desc) html += `<div class="tt-desc">${d.data.desc}</div>`;
  if (d.data.impact) {
    const bg = statusBg[d.data.status];
    const fg = statusColor[d.data.status];
    html += `<div class="tt-impact" style="background:${bg};color:${fg}">${d.data.impact}</div>`;
  }
  if (d.data.meta) html += `<div class="tt-meta">${d.data.meta}</div>`;
  const childCount = (d._children || d.children || []).length;
  if (childCount > 0) html += `<div class="tt-meta">${childCount} sub-experiments — click to ${d.children ? "collapse" : "expand"}</div>`;
  tooltip.innerHTML = html;
  tooltip.style.opacity = 1;
}

function moveTooltip(event) {
  const pad = 16;
  let x = event.clientX + pad;
  let y = event.clientY + pad;
  if (x + 360 > window.innerWidth) x = event.clientX - 360 - pad;
  if (y + 200 > window.innerHeight) y = event.clientY - 200;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

function hideTooltip() {
  tooltip.style.opacity = 0;
}

// ─── Search / Filter ──────────────────────────────────────────────────────

const searchInput = document.getElementById("search");

searchInput.addEventListener("input", function() {
  const query = this.value.toLowerCase().trim();
  if (!query) {
    clearSearch();
    return;
  }
  highlightSearch(query);
});

function clearSearch() {
  g.selectAll(".node-group").classed("dimmed", false).classed("search-match", false);
  g.selectAll(".link").classed("dimmed", false);
}

function highlightSearch(query) {
  const allNodes = g.selectAll(".node-group");
  const allLinks = g.selectAll(".link");

  allNodes.each(function(d) {
    const text = (d.data.name + " " + (d.data.desc || "") + " " + (d.data.impact || "") + " " + (d.data.meta || "")).toLowerCase();
    const match = text.includes(query);
    d._searchMatch = match;
  });

  // Propagate: if child matches, parent should too
  function propagate(node) {
    if (!node) return false;
    let childMatch = false;
    (node.children || node._children || []).forEach(c => {
      if (propagate(c)) childMatch = true;
    });
    if (childMatch) node._searchMatch = true;
    return node._searchMatch;
  }
  propagate(root);

  allNodes.classed("dimmed", d => !d._searchMatch);
  allNodes.classed("search-match", d => {
    const text = (d.data.name + " " + (d.data.desc || "") + " " + (d.data.impact || "") + " " + (d.data.meta || "")).toLowerCase();
    return text.includes(query);
  });
  allLinks.classed("dimmed", d => !d.target._searchMatch);
}

// ─── Controls ─────────────────────────────────────────────────────────────

function expandAll() {
  function expand(d) {
    if (d._children) {
      d.children = d._children;
      d._children = null;
    }
    if (d.children) d.children.forEach(expand);
  }
  expand(root);
  update(root);
}

function collapseAll() {
  function collapse(d) {
    if (d.children) {
      d._children = d.children;
      d.children = null;
    }
    if (d._children) d._children.forEach(collapse);
  }
  root.children.forEach(collapse);
  update(root);
}

function resetView() {
  searchInput.value = "";
  clearSearch();
  svg.transition().duration(500).call(
    zoom.transform,
    d3.zoomIdentity.translate(margin.left, height / 2).scale(0.7)
  );
}

function truncate(str, len) {
  return str.length > len ? str.slice(0, len) + "..." : str;
}

// Handle resize
window.addEventListener("resize", () => {
  svg.attr("width", container.clientWidth).attr("height", container.clientHeight);
});
</script>
