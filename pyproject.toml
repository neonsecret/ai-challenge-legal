[project]
name = "arlc-legal-qa"
version = "1.0.0"
description = "ARLC 2026 Agentic RAG Legal Challenge — DIFC legal document QA pipeline"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "anthropic[vertex]>=0.84.0",
    "docling>=2.0.0",
    "flashrank>=0.2.10",
    "openai>=2.24.0",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "sentence-transformers>=5.2.3",
    "fastapi>=0.133.1",
    "uvicorn>=0.41.0",
    "sse-starlette>=3.2.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.21.0",
    "python-multipart>=0.0.12",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "alembic>=1.18.4",
    "greenlet>=3.3.2",
    "authlib>=1.6.9",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5",
    "resend>=2.26.0",
    "email-validator>=2.3.0",
    "stripe>=15.0.0",
    "itsdangerous>=2.2.0",
    "ddgs>=9.12.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
]

[project.scripts]
arlc = "arlc.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["arlc*", "neolex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require data/ corpus on disk)",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# Exclude benchmark/research/script directories — not production code
exclude = [
    "benchmarks/",
    "speed_agent/",
    "scripts/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",   # line too long (handled by line-length setting)
    "E402",   # module-level import not at top of file (intentional: load_dotenv() must precede Settings import)
]

[tool.bandit]
# Skips are reviewed and confirmed false positives or accepted risks:
#   B101  - assert statements (test helpers only)
#   B105/B106 - "hardcoded password": these are token-type label strings, not credentials
#   B110  - try/except/pass: intentional resilience pattern throughout async codebase
#   B311  - pseudo-random: used only for non-cryptographic test/corpus data
#   B310  - urllib.request.urlopen: localhost health check, URL is not user-controlled
#   B404  - subprocess import: informational-only, actual subprocess calls are audited below
#   B603  - subprocess without shell=True: audited, inputs are fully controlled (llama-server)
#   B605/B607 - shell/partial-path subprocess: corpus preparation scripts with controlled inputs
#   B608  - SQL injection: where_clause is built from hardcoded literal strings + bind params only
#   B615  - HuggingFace unpinned from_pretrained: offline model, no runtime web download
skips = ["B101", "B105", "B106", "B110", "B311", "B310", "B404", "B603", "B605", "B607", "B608", "B615"]
