[project]
name = "arlc-legal-qa"
version = "1.0.0"
description = "ARLC 2026 Agentic RAG Legal Challenge — DIFC legal document QA pipeline"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.84.0",
    "docling>=2.0.0",
    "bm25s>=0.3.2",
    "chromadb>=1.5.2",
    "faiss-cpu>=1.7.4",
    "flashrank>=0.2.10",
    "openai>=2.24.0",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "sentence-transformers>=5.2.3",
]

[project.scripts]
arlc = "arlc.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
