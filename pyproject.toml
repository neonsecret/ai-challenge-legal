[project]
name = "arlc-legal-qa"
version = "1.0.0"
description = "ARLC 2026 Agentic RAG Legal Challenge — DIFC legal document QA pipeline"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "anthropic[vertex]>=0.84.0",
    "docling>=2.0.0",
    "bm25s>=0.3.2",
    "chromadb>=1.5.2",
    "faiss-cpu>=1.7.4",
    "flashrank>=0.2.10",
    "openai>=2.24.0",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "sentence-transformers>=5.2.3",
    "fastapi>=0.133.1",
    "uvicorn>=0.41.0",
    "sse-starlette>=3.2.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.21.0",
    "python-multipart>=0.0.12",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "alembic>=1.18.4",
    "greenlet>=3.3.2",
    "authlib>=1.6.9",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5",
    "resend>=2.26.0",
    "email-validator>=2.3.0",
    "stripe>=15.0.0",
    "itsdangerous>=2.2.0",
    "ddgs>=9.12.0",
]

[project.scripts]
arlc = "arlc.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
include = ["arlc*", "neolex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require data/ corpus on disk)",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
